name: SENEX Current CI Shadow

on:
  push:
    branches:
      - migration/github-ci-shadow-013a

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  SUPABASE_URL: "http://127.0.0.1:9"
  SUPABASE_KEY: "sandbox-fake-not-a-secret"
  EDGE_SOURCE_SHA: "9ad2c160f2ade19299a1d7dc2f0cfcbe6c13233c"
  EDGE_SOURCE_TREE: "d902e2112a015e29661f0ea99059b1915c236dd2"
  DETERMINISTIC_BASE_SHA: "f58e2f3e5555b954a93b988225036b65b60ac9b8"
  HISTORICAL_DEBT_SHA256: "cb74860c1b100e4e8a334174fbddda8e549b08ce8627b6d38bfac397570878fe"

jobs:
  current-ci-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact shadow head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify exact ancestry and mirror identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EDGE_SOURCE_SHA"
          test "$(git rev-parse "$EDGE_SOURCE_SHA^{tree}")" = "$EDGE_SOURCE_TREE"
          test "$(git merge-base HEAD "$EDGE_SOURCE_SHA")" = "$EDGE_SOURCE_SHA"
          test "$(git merge-base HEAD "$DETERMINISTIC_BASE_SHA")" = "$DETERMINISTIC_BASE_SHA"
          changed="$(git diff --name-only "$EDGE_SOURCE_SHA" HEAD)"
          test "$changed" = ".github/workflows/senex-current-ci.yml"
          for path in             research/arq2_top2_prospective_011_manifest.json             research/arq2_top2_prospective_011_progress.json             research/arq2_top2_prospective_011_rows.jsonl             edge_lab/arq2_top2_prospective_011.py; do
            test "$(git rev-parse "$EDGE_SOURCE_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          echo "MIRROR_ANCESTRY=PASS"
          echo "011_BLOB_IDENTITY=PASS"

      - name: Install current CI dependencies
        shell: bash
        run: |
          set -euo pipefail
          python --version
          node --version
          python -m pip install --require-hashes -r senecio_polymarket/requirements.lock
          python -m pip install pytest pytest-subtests

      - name: Current deterministic and safety gates
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/senecio_polymarket"
          python ci/verify_edge_lab.py
          python -m compileall -q edge_lab senecio_polymarket tests
          echo "COMPILEALL=PASS"

      - name: Focused current EDGE tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/senecio_polymarket"
          python -m pytest tests/edge_lab -q

      - name: Full current EDGE test directory
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/senecio_polymarket"
          python -m pytest tests/ -q
      - name: Focused PAPER safety tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/senecio_polymarket"
          python -m pytest -q             tests/test_paper_hard_lock.py             tests/test_network_write_safety.py             tests/test_health_readiness.py             tests/test_paper_execution_realism.py

      - name: Baseline-aware static diff ratchet
        shell: bash
        run: |
          set -euo pipefail
          debt_file="$(mktemp)"
          trap 'rm -f "$debt_file"' EXIT

          set +e
          git diff --check "$DETERMINISTIC_BASE_SHA" "$EDGE_SOURCE_SHA" >"$debt_file" 2>&1
          debt_status=$?
          set -e

          test "$debt_status" -ne 0
          historical_debt_sha256="$(sha256sum "$debt_file" | awk '{print $1}')"
          echo "HISTORICAL_DEBT_SHA256=$historical_debt_sha256"
          test "$historical_debt_sha256" = "$HISTORICAL_DEBT_SHA256"
          echo "HISTORICAL_DEBT_FINGERPRINT=PASS"

          git diff --check "$EDGE_SOURCE_SHA" "$GITHUB_SHA"
          echo "NEW_DELTA_DIFF_CHECK=PASS"
