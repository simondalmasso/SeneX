name: SENEX Canonical CI

on:
  push:
    branches:
      - migration/github-cutover-015
      - main

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  CANONICAL_MAIN_PARENT: "cc7c9d2ebe933f3696723f2512d508232fbc2895"
  CANONICAL_MAIN_TREE: "d8463395b383e3ece6289890ad3d426d777b016b"
  LEGACY_ARCHIVE_SHA: "43c8023d3a4623381e45da02d9efa8e9b5888f47"
  CORE_C7_SHA: "c7f7dca0e7b9f9bc3a4bf8371ae17b4eb2a65e8a"
  EDGE_011_SHA: "9ad2c160f2ade19299a1d7dc2f0cfcbe6c13233c"

jobs:
  canonical-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout canonical candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Verify canonical lineage and preserved refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$CANONICAL_MAIN_PARENT^{tree}")" = "$CANONICAL_MAIN_TREE"
          test "$(git merge-base "$GITHUB_SHA" "$CANONICAL_MAIN_PARENT")" = "$CANONICAL_MAIN_PARENT"

          if [ "$GITHUB_REF_NAME" = "migration/github-cutover-015" ]; then
            test "$(git rev-parse HEAD^)" = "$CANONICAL_MAIN_PARENT"
            changed="$(git diff --name-only "$CANONICAL_MAIN_PARENT" "$GITHUB_SHA")"
            test "$changed" = ".github/workflows/senex-current-ci.yml"
          fi

          remote_sha() {
            git ls-remote origin "$1" | awk '{print $1}'
          }

          test "$(remote_sha refs/heads/archive/github-main-pre-gitlab-20260924)" = "$LEGACY_ARCHIVE_SHA"
          test "$(remote_sha refs/heads/migration/gitlab-main-20260924)" = "$CANONICAL_MAIN_PARENT"
          test "$(remote_sha refs/heads/migration/gitlab-core-c7)" = "$CORE_C7_SHA"
          test "$(remote_sha refs/heads/migration/gitlab-edge-011)" = "$EDGE_011_SHA"

          workflow_files="$(find .github/workflows -maxdepth 1 -type f -printf '%P\n' | sort)"
          test "$workflow_files" = "senex-current-ci.yml"

          echo "CANONICAL_LINEAGE=PASS"
          echo "LEGACY_ARCHIVE_PRESERVED=PASS"
          echo "CORE_C7_REF_PRESERVED=PASS"
          echo "EDGE_011_REF_PRESERVED=PASS"
          echo "WORKFLOW_SURFACE=PASS"

      - name: Install canonical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python --version
          node --version
          python -m pip install --require-hashes -r senecio_polymarket/requirements.lock

      - name: Canonical PAPER and capability gates
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/senecio_polymarket"
          python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import re
          import subprocess

          from senecio_polymarket.backend.readiness_contract import build_readiness_contract

          snap = SimpleNamespace(
              authority_history_complete=True,
              exact_count_complete=True,
              provenance={"exact": True},
              live_gate={
                  "trade_mode": "PAPER",
                  "orders_enabled": False,
                  "live_capital_locked": True,
              },
              snapshot_id="ci",
              generation=1,
              canonical_sha256="ci",
          )
          ready = build_readiness_contract(
              snap,
              {"snapshot_stale": False, "last_refresh_error": None},
              oracle_started=True,
              adapters={},
          )
          assert ready["status"] == "ready"
          assert ready["safety"] == {
              "trade_mode": "PAPER",
              "orders_enabled": False,
              "live_capital_locked": True,
          }
          assert ready["checks"]["paper_lock"] is True
          assert ready["checks"]["orders_disabled"] is True
          print("PAPER_INVARIANTS=PASS")

          runtime = Path("senecio_polymarket/backend/oracle_runner.py").read_text(encoding="utf-8")
          for forbidden in (
              "place_market_order",
              "create_market_order",
              "create_order",
              "fetch_balance",
              "withdraw",
          ):
              assert forbidden not in runtime, f"private order capability entered runtime: {forbidden}"

          connector = Path("senecio_polymarket/oracle/exchange_connector.py").read_text(encoding="utf-8")
          if ".create_market_order(" in connector:
              for guard in (
                  'exchange_name == "binance_testnet"',
                  "BINANCE_TESTNET_KEY",
                  "BINANCE_TESTNET_SECRET",
                  "set_sandbox_mode(True)",
                  '"testnet" not in fapi_private',
              ):
                  assert guard in connector, f"testnet order guard missing: {guard}"
              assert "BINANCE_KEY" not in connector
              assert "BINANCE_SECRET" not in connector
          print("ORDER_CAPABILITY_BOUNDARY=PASS")

          for forbidden_path in (
              "edge_lab",
              "research/arq2_top2_prospective_011_manifest.json",
              "research/arq2_top2_prospective_011_progress.json",
              "research/arq2_top2_prospective_011_rows.jsonl",
          ):
              assert not Path(forbidden_path).exists(), f"011/EDGE mixed into canonical main: {forbidden_path}"
          print("EDGE_011_NOT_MIXED=PASS")

          patterns = {
              "private-key-header": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "gitlab-pat": re.compile(r"glpat-[A-Za-z0-9_-]{20,}"),
              "github-pat": re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              "openai-project-key": re.compile(r"sk-proj-[A-Za-z0-9_-]{20,}"),
          }
          hits = []
          tracked = subprocess.run(
              ["git", "ls-files"], check=True, capture_output=True, text=True
          ).stdout.splitlines()
          for name in tracked:
              path = Path(name)
              if path.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".zip", ".pdf"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for kind, pattern in patterns.items():
                  if pattern.search(text):
                      hits.append(f"{kind}:{name}")
          assert not hits, "credential pattern(s) found: " + ", ".join(hits)
          print("SECRET_SCAN=CLEAN")
          PY

          python -m compileall -q senecio_polymarket
          echo "COMPILEALL=PASS"

      - name: Canonical static diff ratchet
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$CANONICAL_MAIN_PARENT" "$GITHUB_SHA"
          echo "NEW_DELTA_DIFF_CHECK=PASS"
