name: AUDIT TEMP dependency lock refresh

on:
  push:
    branches:
      - audit/full-repo-cleanup-20261004
    paths:
      - senecio_polymarket/requirements.txt
      - .github/workflows/audit-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-lock-refresh
  cancel-in-progress: false

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-repo-cleanup-20261004
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Regenerate hashed lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip-tools==7.6.1" "pip-audit==2.10.1"
          python -m piptools compile             --allow-unsafe             --generate-hashes             --output-file=senecio_polymarket/requirements.lock             --strip-extras             senecio_polymarket/requirements.txt

          changed="$(git diff --name-only)"
          test "$changed" = "senecio_polymarket/requirements.lock"

          python -m pip install --require-hashes -r senecio_polymarket/requirements.lock
          pip-audit             -r senecio_polymarket/requirements.lock             --no-deps             --disable-pip

          python - <<'PY'
          import importlib.metadata as md
          for name in ("fastapi", "starlette", "pydantic-settings", "urllib3"):
              print(f"{name}={md.version(name)}")
          PY

      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add senecio_polymarket/requirements.lock
          if git diff --cached --quiet; then
            echo "LOCK_CHANGE=NONE"
            exit 0
          fi
          git commit -m "build: refresh hashed dependency lock"
          git push origin HEAD:audit/full-repo-cleanup-20261004
