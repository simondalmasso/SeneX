name: ORDER070 R8 Readonly Memory Forensics
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r8-forensics
  cancel-in-progress: true
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
      TARGET_TREE: 5d1d9ec806b7d0e02031726565f08ef75d5a9340
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/R8-forensic','description':f"run {os.environ['RUN_ID']} read-only memory forensics",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r8-forensic-status/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
      - name: Checkout immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Checkout exact forensic runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Assert read-only R8 forensic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C candidate status --porcelain)"
          python -m py_compile ops/.github/scripts/order070_r8_forensic_collect.py
          ! grep -Eq "\b(POST|PATCH|PUT|DELETE)\b" ops/.github/scripts/order070_r8_forensic_collect.py
          ! grep -Eq "restart|resume|pause|scale|runtime-environment" ops/.github/scripts/order070_r8_forensic_collect.py
      - name: Install Northflank JS client in isolated temp dir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r8nf
          mkdir -p /tmp/r8nf && cd /tmp/r8nf
          npm init -y >/dev/null 2>&1
          npm install --silent @northflank/js-client
          cp "$GITHUB_WORKSPACE/ops/.github/scripts/order070_r8_forensic.mjs" /tmp/r8nf/forensic.mjs
      - name: Sample production cgroup and process memory read-only
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          (cd /tmp/r8nf && node forensic.mjs)
          if [ -d /tmp/r8nf/order070-r8-forensic-evidence ]; then
            cp -R /tmp/r8nf/order070-r8-forensic-evidence "$GITHUB_WORKSPACE/"
          fi
      - name: Correlate Northflank telemetry and runtime phases
        if: always()
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r8_forensic_collect.py
      - name: Upload R8 forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r8-forensic-4b107bfb
          path: order070-r8-forensic-evidence/
          if-no-files-found: warn
          retention-days: 30
