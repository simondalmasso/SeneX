name: ORDER070 R8 Exact Terminal
on:
  push:
    branches: [ops/senex-zero-cost-audit-20260809]
    paths: [.github/workflows/order070-origin-exact-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: order070-r8-exact-terminal
  cancel-in-progress: false
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      TARGET_SHA: 750d6042fd1d983c30ca14c503ea09544fc62850
      TARGET_TREE: 16d8c8943bdb7dca2b76d78328df4d083e6512df
      CANDIDATE_DIR: candidate
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
    steps:
      - name: Publish run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':'pending','context':'ORDER070/R8-exact-terminal','description':f"run {os.environ['RUN_ID']} exact deploy + edge + 30m stability",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r8-terminal/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY

      - name: Checkout exact R8 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 750d6042fd1d983c30ca14c503ea09544fc62850
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Checkout exact ops runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: Assert exact immutable candidate and exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git -C candidate status --porcelain)"
          test "$(git -C candidate diff --name-only 4b107bfb427cb85ea84850ffd9ddd5d7a4231d94..HEAD | sort)" = "$(printf '%s\n' \
            senecio_polymarket/backend/authority_snapshot.py \
            senecio_polymarket/backend/main_real.py \
            senecio_polymarket/backend/supabase_client.py \
            senecio_polymarket/frontend/app.js \
            senecio_polymarket/tests/test_order_070_r8.py | sort)"
          python - <<'PY'
          import json,os,urllib.request
          runs={'ORDER070':32601225258,'SCORE001':32601225277,'SCORE002':32601225290,'SMOKE':32601225208}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','User-Agent':'senex-r8-ci-proof/1'}
          for name,rid in runs.items():
              u=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{rid}"
              with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: x=json.load(r)
              print(f"CI_{name}_RUN={rid} STATUS={x.get('status')} CONCLUSION={x.get('conclusion')} HEAD={x.get('head_sha')}")
              assert x.get('status')=='completed' and x.get('conclusion')=='success' and x.get('head_sha')==os.environ['TARGET_SHA']
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute canonical build digest and static safety seal
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=senecio_polymarket python - <<'PY' >> "$GITHUB_ENV"
          from backend.runtime_provenance import canonical_build_digest
          print('BUILD_DIGEST='+canonical_build_digest())
          PY
          test ! -e senecio_polymarket/Dockerfile
          grep -q '^USER senex:senex$' Dockerfile
          ! grep -q 'chmod -R 777' Dockerfile
          ! grep -q 'mv /app/oracle/predict_only.py' Dockerfile
          ! grep -q 'cp /app/oracle_runtime/predict_only.py' Dockerfile
          grep -q 'from oracle_runtime.predict_only import' senecio_polymarket/backend/oracle_runner.py
          test "$(sha256sum senecio_polymarket/oracle_runtime/predict_only.py | cut -d' ' -f1)" = baed36d907354970d7a58c745d0b719300bf35a3b272d742aef59c55abec3660
          test "$(sha256sum senecio_polymarket/oracle_runtime/institutional_core_real.py | cut -d' ' -f1)" = 12b810f54c00f170b2ef577b6ae07fbab1374f39f0e14503c801045141b45557
          grep -q "if (readiness.status === 'not_ready')" senecio_polymarket/frontend/app.js
          test "$(grep -c 'setInterval(refreshContext, 2000)' senecio_polymarket/frontend/app.js)" = 1
          python -m py_compile ../ops/.github/scripts/order070_r8_terminal.py

      - name: Build ONLY canonical root Dockerfile
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull=false -f Dockerfile \
            --build-arg SENEX_SOURCE_COMMIT="$TARGET_SHA" \
            --build-arg SENEX_SOURCE_TREE="$TARGET_TREE" \
            --build-arg SENEX_BUILD_DIGEST="$BUILD_DIGEST" \
            --build-arg SENEX_IMAGE_DIGEST=unknown \
            -t senex-order070-r8-final .

      - name: Inspect exact built image
        shell: bash
        run: |
          set -euo pipefail
          user="$(docker inspect --format '{{.Config.User}}' senex-order070-r8-final)"
          echo "IMAGE_CONFIG_USER=$user"
          test "$user" = 'senex:senex'
          uid="$(docker run --rm --entrypoint sh senex-order070-r8-final -c 'id -u')"
          echo "IMAGE_RUNTIME_UID=$uid"
          test "$uid" = '10001'
          ww="$(docker run --rm --entrypoint sh senex-order070-r8-final -c 'find /app -xdev -type d -perm -0002 -print')"
          printf 'WORLD_WRITABLE_APP_PATHS=%s\n' "$ww"
          test -z "$ww"
          docker run --rm --entrypoint python senex-order070-r8-final -c "from backend import oracle_runner; import inspect; s=inspect.getsource(oracle_runner._run_one_prediction); assert 'oracle_runtime.predict_only' in s; print('EXPLICIT_RUNTIME_IMPORT=PASS')"

      - name: Exact build deploy edge reconcile E2E and 30m stability
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test -n "${NORTHFLANK_API_TOKEN:-}"
          echo "::add-mask::${NORTHFLANK_API_TOKEN}"
          python ops/.github/scripts/order070_r8_terminal.py
          (cd order070-r8-final-evidence && sha256sum -c MANIFEST.sha256)

      - name: Seal exact evidence bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf order070-r8-evidence.tar.gz order070-r8-final-evidence
          sha256sum order070-r8-evidence.tar.gz | tee ORDER070_R8_ARTIFACT.sha256
          sha256sum order070-r8-final-evidence/MANIFEST.sha256 | tee ORDER070_R8_MANIFEST_FILE.sha256

      - name: Upload fresh R8 terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order070-r8-terminal-750d6042fd1d983c30ca14c503ea09544fc62850
          path: |
            order070-r8-final-evidence/
            order070-r8-evidence.tar.gz
            ORDER070_R8_ARTIFACT.sha256
            ORDER070_R8_MANIFEST_FILE.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Publish terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['JOB_STATUS']=='success' else 'failure'
          u=f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}"
          p={'state':state,'context':'ORDER070/R8-exact-terminal','description':f"run {os.environ['RUN_ID']} {state}",'target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"}
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'senex-r8-terminal/1'}
          with urllib.request.urlopen(urllib.request.Request(u,data=json.dumps(p).encode(),headers=h,method='POST'),timeout=30) as r: print(r.status)
          PY
